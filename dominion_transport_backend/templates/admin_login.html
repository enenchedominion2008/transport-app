<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion · Admin Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; width: 100%;
      background: linear-gradient(145deg, #0a1c2b 0%, #12354d 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .admin-card {
      width: 100%; max-width: 420px;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .brand-header {
      display: flex; align-items: baseline; gap: 0.5rem;
      margin-bottom: 0.25rem;
    }
    .brand-name { font-size: 1.5rem; font-weight: 700; color: #0a2a3b; }
    .brand-accent { font-size: 1.5rem; font-weight: 300; color: #2d9cdb; }
    .admin-badge {
      display: inline-block;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      background: #fff6e5; color: #b54708;
      padding: 0.25rem 0.7rem; border-radius: 40px;
      margin-bottom: 1.25rem;
    }
    h2 { font-size: 1.75rem; font-weight: 600; color: #0b2a3b; margin-bottom: 0.25rem; }
    .subhead {
      font-size: 0.9rem; color: #5e7a8c; margin-bottom: 1.75rem;
      border-left: 3px solid #f59e0b; padding-left: 0.75rem;
    }
    .input-group { margin-bottom: 1.1rem; display: flex; flex-direction: column; }
    .input-group label {
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #2c4a5e; margin-bottom: 0.4rem;
    }
    .input-group input {
      padding: 0.85rem 1rem; font-size: 0.95rem;
      border: 1.5px solid #dae2e9; border-radius: 14px;
      background: #f9fcff; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      font-family: inherit; color: #0b2a3b;
    }
    .input-group input:focus {
      border-color: #f59e0b; background: #ffffff;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
    }
    .submit-btn {
      width: 100%; padding: 1rem;
      background: #0a2a3b; color: white;
      font-weight: 600; font-size: 1rem; border: none;
      border-radius: 40px; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 20px -8px rgba(10, 42, 59, 0.35);
      margin-top: 1rem;
    }
    .submit-btn:hover { background: #1d4b63; }
    .submit-btn:active { transform: scale(0.98); }

    .flash {
      padding: 0.75rem 1rem; border-radius: 14px; font-size: 0.85rem;
      margin-bottom: 1rem; font-weight: 500;
    }
    .flash.error   { background: #fdecec; color: #b42318; border-left: 4px solid #dc2626; }
    .flash.success { background: #e7f8ef; color: #067647; border-left: 4px solid #16a34a; }
    .flash.warning { background: #fff6e5; color: #b54708; border-left: 4px solid #f59e0b; }
    .flash.info    { background: #e8f4fd; color: #1c5d8a; border-left: 4px solid #2d9cdb; }
  </style>
</head>
<body>
  <div class="admin-card">
    <div class="brand-header">
      <span class="brand-name">Dominion</span>
      <span class="brand-accent">Transport</span>
    </div>
    <div class="admin-badge">🔒 Admin Access</div>
    <h2>Admin Sign In</h2>
    <div class="subhead">Approve or reject user bookings.</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="input-group">
        <label for="username">Admin Username</label>
        <input type="text" id="username" name="username" placeholder="admin"
               autocomplete="username" required>
      </div>
      <div class="input-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn">Enter Admin Panel</button>
    </form>
  </div>
</body>
</html>
